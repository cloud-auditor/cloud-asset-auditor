rules:
    - type: oci.compute.instance
      shape_from:
        tag: shape
      shape_table: oci
      terms:
        - rate:
            from_shape: ocpu_rate
          quantity:
            tag: ocpus
            raw: shapeConfig.ocpus
            shape: default_ocpu
        - rate:
            from_shape: memory_rate
          quantity:
            tag: memory_gb
            raw: shapeConfig.memoryInGBs
            shape: default_memory_gb
          optional: true
      zero_when_status:
        - STOPPED
        - TERMINATED
      zero_note: instance is stopped — OCPU and memory are not billed while it is; its boot volume still is.
      unpriced_components:
        - Windows OS licensing (B88318, per OCPU-hour) — the instance does not report whether its image is Windows.
        - GPU and local NVMe SKUs on GPU and DenseIO shapes.
    - type: oci.block_volume
      terms:
        - rate: oci.block.storage
          quantity:
            tag: size_gb
            raw: sizeInGBs
        - rate: oci.block.vpu
          quantity:
            tag: size_gb
            raw: sizeInGBs
            multiply_by:
                tag: vpus_per_gb
                raw: vpusPerGB
                default: 10
    - type: oci.boot_volume
      terms:
        - rate: oci.block.storage
          quantity:
            tag: size_gb
            raw: sizeInGBs
        - rate: oci.block.vpu
          quantity:
            tag: size_gb
            raw: sizeInGBs
            multiply_by:
                tag: vpus_per_gb
                raw: vpusPerGB
                default: 10
    - type: oci.load_balancer
      terms:
        - rate: oci.lb.base
          quantity:
            literal: 1
      unpriced_components:
        - Bandwidth (oci.lb.bandwidth, B93031) — Mbps-hours are consumption, not inventory.
    - type: oci.oke.cluster
      terms:
        - rate: oci.oke.enhanced_cluster
          quantity:
            literal: 1
      condition:
        tag: cluster_type
        equals: ENHANCED_CLUSTER
      else_basis: unknown
      else_note: a BASIC_CLUSTER control plane is free and an ENHANCED_CLUSTER is charged hourly; without a cluster_type tag the two are indistinguishable. Worker nodes bill as compute instances and are counted there.
    - type: oci.vault
      terms:
        - rate: oci.vault.private
          quantity:
            literal: 1
      condition:
        tag: vault_type
        equals: VIRTUAL_PRIVATE
      else_basis: unknown
      else_note: a DEFAULT or EXTERNAL vault has no hourly charge; its key versions bill monthly beyond the first 20 tenancy-wide, which the vault asset cannot see.
    - type: oci.object_storage.bucket
      basis: unpriceable
      note: billed per GB-month stored (oci.object_storage.storage, B91628) plus per 10k requests (oci.object_storage.requests, B91627). An inventory knows the bucket exists, not what is in it or how often it is read.
    - type: oci.network_load_balancer
      basis: unpriceable
      note: Oracle's price list has no SKU for the network load balancer itself — the object carries no charge. What you pay for is the traffic through it, which an inventory cannot see.
    - type: oci.nat_gateway
      basis: unpriceable
      note: the gateway itself carries no charge; egress through it is billed as data transfer, which this tool does not model for any provider.
    - type: oci.drg
      basis: unpriceable
      note: the DRG itself carries no charge; remote peering connections and the traffic across them are billed, and neither is visible from the DRG.
    - type: oci.vcn
      basis: unknown
      note: no charge for the VCN object. Cost lives in what is attached to it — instances, load balancers, gateways.
    - type: oci.subnet
      basis: unknown
      note: no charge for the subnet object.
    - type: oci.internet_gateway
      basis: unknown
      note: no charge for the internet gateway object; egress through it is data transfer, which this tool does not model.
    - type: oci.service_gateway
      basis: unknown
      note: no charge for the service gateway object. Traffic to OCI services through it is not billed as internet egress.
    - type: oci.local_peering_gateway
      basis: unknown
      note: no charge for the local peering gateway object; traffic across a local peering within a region is not billed.
    - type: oci.compartment
      basis: unknown
      note: a compartment is an organisational container, not a billable resource.
    - type: oci.iam.user
      basis: unknown
      note: OCI does not charge per IAM user.
    - type: oci.iam.group
      basis: unknown
      note: OCI does not charge per IAM group.
    - type: oci.iam.policy
      basis: unknown
      note: OCI does not charge per IAM policy.
    - type: oci.iam.dynamic_group
      basis: unknown
      note: OCI does not charge per dynamic group.
